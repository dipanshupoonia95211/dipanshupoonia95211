name: Update profile art

# The heatmap is not embedded in README.md right now, so the automatic triggers
# are off -- otherwise this would commit a regenerated SVG nothing displays,
# every single morning.
#
# >>> PUT THE HEATMAP BACK IN README.md?  Uncomment the two blocks below and the
#     daily refresh resumes exactly as before. Nothing else needs changing.
"on":
  workflow_dispatch: {}
  # schedule:
  #   - cron: "17 6 * * *"    # ~06:17 UTC daily
  # push:
  #   branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Scrape public contribution calendar
        env:
          GH_USERNAME: ${{ github.repository_owner }}
        run: python scripts/fetch_contributions.py

      - name: Render heatmap SVG
        run: python scripts/render_heatmap_svg.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
