     aria-label="neofetch-style info card for dipanshu@github">
  <style>
    text { font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace; font-size:13px; }
